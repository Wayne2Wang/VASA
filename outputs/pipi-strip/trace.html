<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VASA · Run walkthrough</title><style>body{margin:0;background:#000;min-height:100dvh;display:flex;align-items:center;justify-content:center}/* Four roles, each with its own hue and lightness: the agent (amber) owns every
   decision; strategy (violet) and the working mask (green) are its persistent
   state; SAM3 (blue) is the one tool it calls. */
.vasa-report{--ink:#f2efe6;--muted:#8a8a8a;--line:#242424;--dim:#1d1d1d;--panel:#0b0b0b;
  --agent:#e8b34c;--sam3:#5b9bd9;--mask:#43b78d;--strategy:#a78bd0;--warn:#d98a5a;
  color:var(--ink);background:#000;font-family:Calibri,Carlito,'Segoe UI',system-ui,sans-serif;
  font-size:16px;padding:22px 28px 18px;display:flex;flex-direction:column;gap:12px;
  box-sizing:border-box;color-scheme:dark;overflow:hidden;
  /* Never taller or wider than it needs to be, centred in whatever is left
     over. The page itself never scrolls; only the conversation and the
     strategy text scroll inside their panels. */
  height:min(900px,100dvh);width:100%;max-width:1600px;margin:auto}
@supports not (height:100dvh){.vasa-report{height:min(900px,100vh)}}
/* Embedded in a page that scrolls (Gradio), the viewer sits below other
   controls, so a full-viewport height would push its footer off the bottom.
   Leave room for the surrounding chrome instead. */
.vasa-report[data-embed=true]{height:min(760px,calc(100dvh - 120px));min-height:520px;margin:0}
@supports not (height:100dvh){.vasa-report[data-embed=true]{height:min(760px,calc(100vh - 120px))}}
.vasa-report *{box-sizing:border-box}
.vasa-report .title{color:#fff;font-size:15.5px}
.vasa-report .title b{font-weight:700}
.vasa-report .asset-bank{display:none}
.vasa-report [hidden]{display:none!important}

.vasa-report .grid{display:grid;grid-template-columns:1.4fr 116px 1fr;
  grid-template-rows:0.62fr 1fr 1fr;row-gap:14px;align-items:stretch;flex-grow:1;min-height:0}

.vasa-report .agent{grid-column:1;grid-row:1/span 3;border-radius:16px;background:#0d0d0d;
  border:2px solid var(--agent);display:flex;flex-direction:column;padding:20px;min-width:0;
  min-height:0;transition:box-shadow .3s;box-shadow:0 0 0 1px #e8b34c33,0 0 22px -10px #e8b34c88}
.vasa-report[data-agent=on] .agent{box-shadow:0 0 0 3px #e8b34c66,0 0 48px -4px #e8b34ccc}
.vasa-report .agent-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-shrink:0}
.vasa-report .agent-head h2{font-size:15px;color:var(--agent);margin:0;font-weight:700;
  font-family:ui-monospace,monospace}
.vasa-report .live-dot{width:10px;height:10px;border-radius:50%;background:var(--agent);
  box-shadow:0 0 10px 2px #e8b34c99;flex-shrink:0;animation:vasaPulse 1.8s ease-in-out infinite}
.vasa-report .badge{margin-left:auto;font-size:12.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}

.vasa-report .chat{background:#070707;border:1px solid var(--line);border-radius:12px;padding:18px;
  flex-grow:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;display:flex;flex-direction:column;gap:14px}
.vasa-report .asked{align-self:flex-end;max-width:82%;flex-shrink:0}
.vasa-report .asked-bubble{display:flex;gap:12px;align-items:center;background:#eee6d8;color:#141414;
  border-radius:16px 16px 4px 16px;padding:12px}
.vasa-report .asked-bubble img{width:72px;height:72px;border-radius:10px;object-fit:contain;
  background:#000;flex-shrink:0}
.vasa-report .asked-bubble p{margin:0;font-size:15px;line-height:1.45;font-style:italic}
.vasa-report .box{align-self:flex-start;width:94%;display:flex;flex-direction:column;gap:6px;
  flex-shrink:0;opacity:1;transition:opacity .3s}
.vasa-report .box.faded{opacity:.45}
.vasa-report .box-head{display:block;width:100%;text-align:left;cursor:pointer;background:#151515;
  border:1px solid var(--line);border-left:4px solid var(--agent);border-radius:4px 16px 16px 16px;
  padding:13px 17px 14px;font:inherit;color:inherit}
.vasa-report .box.warn .box-head{border-left-color:var(--warn)}
.vasa-report .box.unparsed .box-head{border-left-color:var(--muted)}
.vasa-report .box-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.vasa-report .box-kind{font-size:12.5px;color:var(--agent);font-weight:700}
.vasa-report .box.warn .box-kind{color:var(--warn)}
.vasa-report .box.unparsed .box-kind{color:var(--muted)}
.vasa-report .box-pill{flex-shrink:0;font-size:12px;font-weight:700;color:#8b8b8b;
  border:1px solid #2d2d2d;border-radius:999px;padding:3px 10px;white-space:nowrap}
.vasa-report .box-decision{display:block;font-size:18.5px;font-weight:700;color:#f8f5ec;
  line-height:1.35;margin-bottom:6px}
.vasa-report .box-why{display:block;line-height:1.5;color:#8f8f8f;font-size:13.5px}
.vasa-report .box-full{background:#000;border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;max-height:280px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;
  font:12.5px/1.65 ui-monospace,monospace;color:#949494;margin:0}
.vasa-report .typing{align-self:flex-start;background:#151515;border:1px solid var(--line);
  border-radius:4px 16px 16px 16px;padding:11px 15px;display:flex;gap:5px;flex-shrink:0;
  animation:vasaDotsIn .28s ease-out .6s both}
.vasa-report .typing i{width:6px;height:6px;border-radius:50%;background:var(--agent);
  animation:vasaDot 1.2s infinite ease-in-out}
.vasa-report .typing i:nth-child(2){animation-delay:.15s}
.vasa-report .typing i:nth-child(3){animation-delay:.3s}

.vasa-report .wire{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;min-width:0;padding:0 8px}
.vasa-report .wire .line{position:relative;width:100%;height:3px;background:var(--dim);border-radius:3px}
.vasa-report .wire[data-flow=r] .line,.vasa-report .wire[data-flow=l] .line{background:#3d3d3d}
.vasa-report .wire .line::after{content:'';position:absolute;top:-4.5px;width:11px;height:11px;
  border-radius:50%;opacity:0}
.vasa-report .wire[data-flow=r] .line::after{background:var(--agent);box-shadow:0 0 10px 2px #e8b34caa;
  animation:vasaFlowR 1.15s ease-in-out infinite}
.vasa-report .wire[data-wire="1"][data-flow=l] .line::after{background:var(--sam3);
  box-shadow:0 0 10px 2px #5b9bd9aa;animation:vasaFlowL 1.15s ease-in-out infinite}
.vasa-report .wire[data-wire="2"][data-flow=l] .line::after{background:var(--mask);
  box-shadow:0 0 10px 2px #43b78daa;animation:vasaFlowL 1.15s ease-in-out infinite}
.vasa-report .wire span{font-size:12.5px;font-weight:700;text-align:center;width:100%;
  opacity:.28;transition:opacity .3s;display:block}
.vasa-report .wire .out{color:var(--agent)}
.vasa-report .wire[data-wire="1"] .back{color:var(--sam3)}
.vasa-report .wire[data-wire="2"] .back{color:var(--mask)}
.vasa-report .wire[data-flow=r] .out,.vasa-report .wire[data-flow=l] .back{opacity:1}

.vasa-report .panel{border-radius:14px;background:var(--panel);border:1px solid var(--dim);
  display:flex;flex-direction:column;padding:16px;min-width:0;min-height:0;
  transition:border-color .3s,box-shadow .3s}
.vasa-report .panel h2{font-size:14.5px;margin:0;font-weight:700}
.vasa-report .panel .head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-shrink:0}
.vasa-report .panel .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.vasa-report .panel .well{flex-grow:1;min-height:0;border-radius:10px;overflow:hidden;background:#000;
  display:flex;align-items:center;justify-content:center}
.vasa-report .panel .well img{width:100%;height:100%;object-fit:contain}
.vasa-report .panel .cap{margin:8px 0 0;font-size:13px;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.vasa-report .strategy{grid-column:3;grid-row:1}
.vasa-report .strategy h2,.vasa-report .strategy .dot{color:var(--strategy);background-color:var(--strategy)}
.vasa-report .strategy h2{background:none}
.vasa-report[data-strategy=set] .strategy{border-color:var(--strategy);
  box-shadow:0 0 0 2px var(--strategy),0 0 34px -6px var(--strategy)}
.vasa-report[data-strategy=guiding] .strategy{border-color:var(--strategy);
  box-shadow:0 0 0 1px #a78bd066,0 0 26px -8px #a78bd0cc}
/* Fades the last few pixels so clipped text reads as "there is more". */
.vasa-report .strategy .well{display:block;overflow-y:auto;background:#000;border:1px solid var(--dim);
  padding:12px 13px;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent)}
.vasa-report .strategy-head{font-size:15px;font-weight:700;color:#f2ecf8;line-height:1.35;margin-bottom:6px}
.vasa-report .strategy-body{font-size:12.5px;line-height:1.55;color:#8f8f8f}
.vasa-report .muted{color:#5a5a5a;font-size:13.5px}
.vasa-report .sam3{grid-column:3;grid-row:2}
.vasa-report .sam3 h2{color:var(--sam3)}.vasa-report .sam3 .dot{background:var(--sam3)}
.vasa-report .sam3 .well{border:1px dashed var(--line)}
.vasa-report[data-sam3=on] .sam3{border-color:var(--sam3);box-shadow:0 0 0 2px var(--sam3),0 0 34px -6px var(--sam3)}
.vasa-report .mask{grid-column:3;grid-row:3}
.vasa-report .mask h2{color:var(--mask)}.vasa-report .mask .dot{background:var(--mask)}
.vasa-report[data-mask=on] .mask{border-color:var(--mask);box-shadow:0 0 0 2px var(--mask),0 0 34px -6px var(--mask)}
.vasa-report .wire[data-wire="0"]{grid-column:2;grid-row:1}
.vasa-report .wire[data-wire="1"]{grid-column:2;grid-row:2}
.vasa-report .wire[data-wire="2"]{grid-column:2;grid-row:3}

.vasa-report footer{border-top:1px solid #1a1a1a;padding-top:13px;display:flex;align-items:center;
  gap:14px;flex-shrink:0}
.vasa-report footer button[data-action=play]{width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:#151515;color:#eee9dd;cursor:pointer;flex-shrink:0;font-size:14px}
.vasa-report .status{font-size:13.5px;color:#c9c9c9;min-width:230px;font-weight:700}
.vasa-report .ticks{display:flex;gap:6px;flex-grow:1;min-width:0}
.vasa-report .tick{flex:1;min-width:0;height:30px;border-radius:7px;border:1px solid var(--dim);
  background:#0c0c0c;cursor:pointer;padding:0 6px;font:inherit;font-size:11.5px;color:#767676;
  font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:background .2s,border-color .2s}
.vasa-report .tick[aria-pressed=true]{border-color:var(--agent);background:#e8b34c22;color:var(--ink)}
.vasa-report button:focus-visible{outline:2px solid var(--agent);outline-offset:2px}

@keyframes vasaDot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@keyframes vasaDotsIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes vasaPulse{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes vasaFlowR{0%{left:-7px;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 7px);opacity:0}}
@keyframes vasaFlowL{0%{left:calc(100% - 7px);opacity:0}15%{opacity:1}85%{opacity:1}100%{left:-7px;opacity:0}}
@media (prefers-reduced-motion:reduce){
  .vasa-report .live-dot,.vasa-report .typing,.vasa-report .typing i{animation:none}
  .vasa-report .wire .line::after{animation:none!important;opacity:.9;left:calc(50% - 5px)}
}
/* Short windows: give the panels the room instead of the chrome. */
@media (max-height:820px){
  .vasa-report{padding:16px 22px 14px;gap:10px;font-size:15px}
  .vasa-report .agent{padding:14px}
  .vasa-report .chat{padding:14px;gap:10px}
  .vasa-report .panel{padding:12px}
  .vasa-report .box-head{padding:10px 14px 11px}
  .vasa-report .box-decision{font-size:17px;margin-bottom:4px}
  .vasa-report .asked-bubble img{width:56px;height:56px}
  .vasa-report .asked-bubble p{font-size:14px}
  .vasa-report .grid{row-gap:10px}
}
@media (max-height:680px){
  .vasa-report{padding:12px 18px 10px;gap:8px}
  .vasa-report .box-why,.vasa-report .strategy-body{display:none}
  .vasa-report .box-decision{font-size:16px}
  .vasa-report .asked-bubble img{width:44px;height:44px}
  .vasa-report .agent-head{margin-bottom:8px}
  .vasa-report .title{font-size:14px}
}
@media (max-width:1100px){
  .vasa-report .grid{grid-template-columns:1fr;grid-template-rows:auto}
  .vasa-report .agent,.vasa-report .strategy,.vasa-report .sam3,.vasa-report .mask{grid-column:1;grid-row:auto}
  .vasa-report .wire{display:none}
  .vasa-report .panel .well{min-height:220px}
}
</style></head><body><main><div class="vasa-report" data-run="pipi-strip" data-live="false" data-embed="false"><script type="application/json" data-vasa-run>{"query": "Segment everything with a striped pattern", "model": "openai/gpt-6-luna", "termination": "completed", "steps": [{"kind": "Strategy", "decision": "Use an undersegment-and-add strategy for the query “everything with a striped pattern.”…", "rationale": "Set this plan as the session strategy.", "full": "The target appears to include the tabby cat’s striped fur and the visibly striped textile at the lower left; the dotted cushion and plain background are not striped. I’ll use an undersegment-and-add strategy: first capture the clearest striped textile as a base, then segment the tabby cat’s striped coat and add it if needed, aiming to finish within a few calls.\n\nThe image contains a tabby cat with striped coat markings and a striped woven textile in the lower-left corner. I’ll initialize from the textile, then add the cat’s striped fur, checking for unrelated regions before finishing.\n\n\u003cthink>\n1. Analyze: The query asks for every region with a striped pattern. The image shows stripes on the tabby cat’s coat and on the woven textile at the lower left; the dotted cushion and plain background do not appear striped.\n2. Think: The working mask is empty, and there are no prior segmentation results. I’ll start with the clearly striped textile, then add the cat’s striped coat.\n3. Remind: The final mask should cover only the striped regions, not the whole cat or other patterned areas such as the dotted cushion.\n4. Plan: Use an undersegment-and-add approach: segment the striped textile and initialize the mask, then segment the cat’s coat and add the relevant region; finish within a few calls.\n5. Decide: Set this plan as the session strategy.\n\u003c/think>\n\u003ctool> {\"name\":\"set_strategy\",\"parameters\":{\"text\":\"Use an undersegment-and-add strategy for the query “everything with a striped pattern.” The image visibly contains a tabby cat with striped coat markings and a striped woven textile at the lower left; exclude the dotted cushion and plain background. First call segment_phrase with “striped fabric” and use the best candidate to replace the empty working mask. Then call segment_phrase with “tabby cat fur” and add the candidate covering the striped coat, selecting only relevant regions. Inspect the combined mask and return it when it covers the striped textile and fur without unrelated regions. Aim to finish within about 5 calls; if an additional refinement is unlikely to help, return the best current mask.\"}}\u003c/tool>", "tick": "Plan", "panel": "strategy", "unparsed": false, "warning": false}, {"kind": "Tool call", "decision": "segment_phrase(\"striped fabric\")", "rationale": "Call `segment_phrase` for the striped fabric.", "full": "\u003cthink>\n1. Analyze: The query is “Segment everything with a striped pattern.” The working mask is empty, and there is no SAM3 output yet. The image shows striped woven fabric at the lower left and a tabby cat with striped coat markings; the dotted cushion and plain background are not targets.\n2. Think: The recorded strategy is undersegment-and-add: first capture the striped fabric, then add the cat’s striped coat.\n3. Remind: This call will generate candidates only; the working mask remains empty until updated.\n4. Plan: Start with the planned “striped fabric” prompt, then inspect its candidates before initializing the working mask.\n5. Decide: Call `segment_phrase` for the striped fabric.\n\u003c/think>\n\u003ctool> {\"name\":\"segment_phrase\",\"parameters\":{\"text_prompt\":\"striped fabric\"}} \u003c/tool>", "tick": "fabric", "panel": "sam3", "unparsed": false, "warning": false}, {"kind": "Reads result, decides", "decision": "Read 1 mask → replace #1", "rationale": "Replace the empty working mask with candidate 1.", "full": "\u003cthink>\n1. Analyze: The query is “Segment everything with a striped pattern.” The current working mask is empty. The latest SAM3 output contains one candidate, mask 1, covering the striped woven textile at the lower left. The dotted cushion and plain background are not selected.\n2. Think: The textile is a valid striped-pattern region and provides a useful initial mask. The tabby cat’s striped coat is another target that is still missing.\n3. Remind: Preserve the valid textile selection now; a later segmentation can add the cat’s striped fur.\n4. Plan: Following the undersegment-and-add strategy, initialize the mask with the striped fabric candidate, then segment and add the cat’s striped coat.\n5. Decide: Replace the empty working mask with candidate 1.\n\u003c/think>\n\u003ctool> {\"name\": \"update_working_mask\", \"parameters\": {\"operation\": \"replace\", \"selected_masks\": [1]}} \u003c/tool>", "tick": "replace", "panel": "mask", "unparsed": false, "warning": false}, {"kind": "Tool call", "decision": "segment_phrase(\"tabby cat fur\")", "rationale": "Call segment_phrase with “tabby cat fur.”", "full": "\u003cthink>\n1. Analyze: The query is “Segment everything with a striped pattern.” The current working mask covers the striped woven textile at the lower left. The cat’s tabby coat also has stripes and is missing; the dotted cushion and plain background are not targets.\n2. Think: The strategy is undersegment-and-add. The history shows “striped fabric” was segmented and selected to initialize the mask. The next planned step is to find the striped coat and add it.\n3. Remind: The latest candidate is the textile mask, already incorporated. A new segmentation should target only the missing striped pattern.\n4. Plan: Segment the cat’s tabby fur, then inspect its candidate mask before adding it to the working mask.\n5. Decide: Call segment_phrase with “tabby cat fur.”\n\u003c/think>\n\u003ctool>{\"name\":\"segment_phrase\",\"parameters\":{\"text_prompt\":\"tabby cat fur\"}}\u003c/tool>", "tick": "fur", "panel": "sam3", "unparsed": false, dot"></span><h2>Strategy</h2><span class="badge" data-badge="strategy">not set</span></div><div class="well" data-strategy></div><p class="cap" data-cap="strategy"></p></section><section class="panel sam3"><div class="head"><span class="dot"></span><h2>SAM3</h2><span class="badge" data-badge="sam3">&mdash;</span></div><div class="well"><img data-img="candidate" alt="SAM3 candidate masks" hidden><span class="muted" data-empty="candidate">Waiting for a segment_phrase call&hellip;</span></div><p class="cap" data-cap="sam3"></p></section><section class="panel mask"><div class="head"><span class="dot"></span><h2>Working mask</h2><span class="badge" data-badge="mask">gen 0</span></div><div class="well"><img data-img="mask" alt="Working mask" hidden><span class="muted" data-empty="mask">No working mask yet&hellip;</span></div><p class="cap" data-cap="mask"></p></section></div><footer><button type="button" data-action="play" aria-label="Pause playback">&#9208;</button><span class="status" data-status></span><nav class="ticks" data-ticks aria-label="Steps in this run"></nav></footer><span hidden>Segment everything with a striped pattern</span></div></main><script>// One viewer for offline reports and the live Gradio run.
// Python renders a static shell plus a JSON payload from build_run(); this
// fills it in and walks the beats. Every string reaches the DOM through
// textContent, so trace text can never become markup.
function mountVasa(host) {
  const HOLD = {system: 0.7, send: 1.5, input: 0.9, decide: 1.6, toStrategy: 1,
                strategySet: 1.45, toSam3: 1, sam3: 1.25, return: 1.6, toMask: 1,
                maskEdit: 1.25, maskBack: 1.6, warning: 1.5, note: 1};
  const BASE = 1300;
  let root = null, data = null, beat = 0, playing = false, open = null, stopAt = null, timer = null;

  const el = (selector) => root && root.querySelector(selector);
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  function read() {
    const holder = host.querySelector('.vasa-report');
    if (!holder) return null;
    const blob = holder.querySelector('script[type="application/json"][data-vasa-run]');
    try { return blob ? JSON.parse(blob.textContent) : null; } catch (error) { return null; }
  }

  function source(key) {
    const asset = key && root.querySelector('.asset-bank img[data-key="' + key + '"]');
    return asset ? asset.getAttribute('src') : '';
  }

  function stop() { if (timer !== null) clearTimeout(timer); timer = null; }

  function schedule() {
    stop();
    if (!playing) return;
    const limit = stopAt === null ? data.beats.length - 1 : stopAt;
    if (beat >= limit) { playing = false; draw(); return; }
    const hold = HOLD[data.beats[beat].kind] || 1;
    timer = setTimeout(() => {
      if (!host.isConnected) { stop(); return; }
      beat += 1; draw(); schedule();
    }, Math.round(BASE * hold));
  }

  function goTo(step) {
    const first = data.beats.findIndex((b) => b.step === step);
    if (first < 0) return;
    let last = data.beats.length - 1;
    for (let i = first; i < data.beats.length; i++) {
      if (data.beats[i].step !== null && data.beats[i].step > step) { last = i - 1; break; }
    }
    beat = first; stopAt = last; playing = true; open = null;
    draw(); schedule();
  }

  function toggleRun() {
    playing = !playing;
    if (playing) {
      stopAt = null; open = null;
      if (beat >= data.beats.length - 1) beat = 0;
    }
    draw(); schedule();
  }

  function toggleBox(index) {
    stop();
    const opening = open !== index;
    open = opening ? index : null;
    playing = false;
    draw();
    if (!opening) return;
    const chat = el('[data-chat]');
    const box = chat && chat.querySelector('[data-box="' + index + '"]');
    // Expanding the last box would otherwise open it below the fold.
    if (chat && box) chat.scrollTop += box.getBoundingClientRect().top - chat.getBoundingClientRect().top - 12;
  }

  function stepBox(step, index) {
    const wrap = document.createElement('div');
    wrap.className = 'box' + (step.warning ? ' warn' : '') + (step.unparsed ? ' unparsed' : '');
    wrap.dataset.box = String(index);

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'box-head';
    button.dataset.box = String(index);
    button.setAttribute('aria-expanded', String(open === index));

    const top = document.createElement('span');
    top.className = 'box-top';
    const kind = document.createElement('span');
    kind.className = 'box-kind';
    kind.textContent = step.kind;
    const pill = document.createElement('span');
    pill.className = 'box-pill';
    pill.textContent = (open === index ? '▴ hide full message' : '▾ full message');
    top.append(kind, pill);

    const decision = document.createElement('span');
    decision.className = 'box-decision';
    decision.textContent = step.decision;
    button.append(top, decision);

    if (step.rationale) {
      const why = document.createElement('span');
      why.className = 'box-why';
      why.textContent = step.rationale;
      button.append(why);
    }
    wrap.append(button);

    if (open === index) {
      const full = document.createElement('pre');
      full.className = 'box-full';
      full.textContent = step.full;
      wrap.append(full);
    }
    return wrap;
  }

  function draw() {
    if (!root || !data) return;
    const beats = data.beats, steps = data.steps;
    const current = beats[Math.min(beat, beats.length - 1)] || {};
    // Controls belong to a run you can scrub. A run still in progress has no
    // end to seek to; one that has terminated does, saved or just finished.
    const finished = !!data.termination;
    const kind = current.kind;

    const acting = current.light === 'agent';
    const lit = {
      strategy: kind === 'strategySet' || (current.strategy && acting),
      sam3: kind === 'sam3' || kind === 'return',
      mask: kind === 'maskEdit' || kind === 'maskBack',
    };
    root.dataset.agent = acting ? 'on' : 'off';
    root.dataset.strategy = lit.strategy ? (kind === 'strategySet' ? 'set' : 'guiding') : 'off';
    root.dataset.sam3 = lit.sam3 ? 'on' : 'off';
    root.dataset.mask = lit.mask ? 'on' : 'off';
    const flow = {toStrategy: '0r', toSam3: '1r', return: '1l', toMask: '2r', maskBack: '2l'}[kind] || '';
    root.querySelectorAll('[data-wire]').forEach((wire) => {
      const want = wire.dataset.wire;
      wire.dataset.flow = flow.startsWith(want) ? flow.slice(1) : '';
    });

    // panels
    const strategy = el('[data-strategy]');
    strategy.replaceChildren();
    if (current.strategy) {
      const head = document.createElement('div');
      head.className = 'strategy-head';
      head.textContent = current.strategy;
      strategy.append(head);
      if (current.strategy_body) {
        const body = document.createElement('div');
        body.className = 'strategy-body';
        body.textContent = current.strategy_body;
        strategy.append(body);
      }
    } else {
      const none = document.createElement('span');
      none.className = 'muted';
      none.textContent = 'Not set yet.';
      strategy.append(none);
    }
    el('[data-badge="strategy"]').textContent = current.strategy ? 'persistent' : 'not set';

    // Only ever set a src we actually have; an <img> with an empty src renders
    // as a broken image with its alt text showing.
    function show(selector, key) {
      const picture = el('[data-img="' + selector + '"]');
      const uri = source(key);
      if (uri) picture.src = uri;
      picture.hidden = !uri;
      const empty = el('[data-empty="' + selector + '"]');
      if (empty) empty.hidden = !!uri;
      return uri;
    }

    show('candidate', current.candidate);
    el('[data-badge="sam3"]').textContent = current.count || '—';
    el('[data-cap="sam3"]').textContent = current.prompt || 'No call yet';

    show('mask', current.mask || 'MASK0');
    el('[data-badge="mask"]').textContent = current.generation || 'gen 0';
    el('[data-cap="mask"]').textContent = current.operation || 'Working mask · empty';
    el('[data-phase]').textContent = acting ? 'deciding'
      : (kind === 'send' || kind === 'system' || kind === 'input') ? 'reading your message'
      : 'waiting on tools';

    // conversation, opening with what was actually asked
    const chat = el('[data-chat]');
    const asked = document.createElement('div');
    asked.className = 'asked';
    const bubble = document.createElement('div');
    bubble.className = 'asked-bubble';
    const thumb = source('INPUT');
    if (thumb) {
      const picture = document.createElement('img');
      picture.src = thumb;
      picture.alt = 'Input image';
      bubble.append(picture);
    }
    const query = document.createElement('p');
    query.textContent = '“' + (data.query || '(no query recorded)') + '”';
    bubble.append(query);
    asked.append(bubble);
    const shown = steps.slice(0, current.steps || 0);
    chat.replaceChildren(asked, ...shown.map((step, i) => {
      const node = stepBox(step, i);
      if (open !== i && i !== shown.length - 1) node.classList.add('faded');
      return node;
    }));
    const next = beats[beat + 1];
    if (next && next.steps > (current.steps || 0)) {
      const dots = document.createElement('div');
      dots.className = 'typing';
      dots.append(...[0, 1, 2].map(() => document.createElement('i')));
      chat.append(dots);
    }
    if (open === null || playing) chat.scrollTop = chat.scrollHeight;

    // footer
    const play = el('[data-action="play"]');
    if (play) {
      play.textContent = playing ? '⏸' : beat >= beats.length - 1 ? '↻' : '▶';
      play.setAttribute('aria-label', playing ? 'Pause playback'
        : beat >= beats.length - 1 ? 'Replay from the start' : 'Resume playback');
      play.hidden = !finished;
    }
    const position = current.step === null || current.step === undefined ? 1 : current.step + 1;
    el('[data-status]').textContent =
      steps.length ? position + '/' + steps.length + ' · ' + (current.label || '') : (current.label || '');

    const ticks = el('[data-ticks]');
    ticks.replaceChildren(...steps.map((step, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tick';
      button.dataset.step = String(i);
      button.textContent = step.tick;
      button.title = 'Step ' + (i + 1) + ': ' + step.kind;
      button.setAttribute('aria-pressed', String(i === current.step));
      return button;
    }));
    ticks.hidden = !finished;
  }

  function load(next) {
    data = next;
    if (!data || !data.beats || !data.beats.length) return;
    beat = root.dataset.live === 'true' ? data.beats.length - 1 : 0;
    playing = root.dataset.live !== 'true' && !reduced();
    stopAt = null; open = null;
    draw();
    schedule();
  }

  host.addEventListener('click', (event) => {
    const target = event.composedPath().find((n) => n instanceof Element && n.closest('.vasa-report'));
    if (!target || !data) return;
    const button = target.closest('button');
    if (!button) return;
    if (button.dataset.action === 'play') { toggleRun(); return; }
    if (button.dataset.step !== undefined) { goTo(Number(button.dataset.step)); return; }
    if (button.dataset.box !== undefined) { toggleBox(Number(button.dataset.box)); }
  }, true);

  // Live runs push new data instead of replacing the DOM, so playback state,
  // scroll position and in-flight animation survive each round.
  window.vasaPush = function (incoming) {
    if (!root) return;
    const payload = typeof incoming === 'string' ? JSON.parse(incoming) : incoming;
    if (!payload || !payload.beats) return;

    // A different run replaces the view outright and plays from the top;
    // more beats for the run already showing just extend it.
    const switched = !data || (payload.run && payload.run !== data.run);
    if (switched) {
      data = null;
      beat = 0;
    }

    const bank = root.querySelector('.asset-bank');
    Object.entries(payload.assets || {}).forEach(([key, uri]) => {
      if (bank.querySelector('img[data-key="' + key + '"]')) return;
      const picture = document.createElement('img');
      picture.dataset.key = key;
      picture.src = uri;
      picture.alt = '';
      bank.append(picture);
    });

    // Keep walking from wherever we are, so newly arrived rounds animate in
    // rather than the view snapping to the end of the run.
    const following = !data || beat >= data.beats.length - 1;
    data = payload;
    stopAt = null;
    open = null;
    if (following) { playing = !reduced(); schedule(); }
    draw();
  };

  // Gradio delivers rounds by swapping the markup of a separate element, which
  // leaves this viewer's DOM untouched. Watch for it rather than relying on a
  // Gradio event handler, which writes its return value back into the sender.
  let lastFeed = null;
  function readFeed(node) {
    const raw = node && node.getAttribute('data-vasa-feed');
    if (!raw || raw === lastFeed || !root) return;
    try {
      const bytes = Uint8Array.from(atob(raw), (c) => c.charCodeAt(0));
      window.vasaPush(JSON.parse(new TextDecoder().decode(bytes)));
      lastFeed = raw;          // only after it lands, so a failed read retries
    } catch (error) { /* a partial or malformed push is simply ignored */ }
  }
  const sweepFeeds = () => document.querySelectorAll('[data-vasa-feed]').forEach(readFeed);

  // Mount before wiring the feed: a push arriving first would find no viewer.
  root = host.querySelector('.vasa-report');
  if (root) load(read());

  const observer = new MutationObserver(() => {
    const found = host.querySelector('.vasa-report');
    if (found && found !== root) { root = found; load(read()); sweepFeeds(); }
  });
  observer.observe(host, {childList: true, subtree: true});

  const feedWatcher = new MutationObserver(sweepFeeds);
  feedWatcher.observe(document.body, {childList: true, subtree: true, attributes: true,
                                      attributeFilter: ['data-vasa-feed']});
  sweepFeeds();
}

mountVasa(document.querySelector("main"));</script></body></html>
